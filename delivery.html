<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصّلي | سيستم الموظفين</title>
<meta name="theme-color" content="#08142f">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#050d22;--navy:#08142f;--n2:#0f1f45;--n3:#162a5c;--cream:#f4efe6;--muted:#8f9bbd;--line:rgba(244,239,230,.1);
--or:#ff6a13;--gr:#19c37d;--red:#ff4b4b;--yl:#f5b52e;--bl:#4c8dff;
--h:'Alexandria',sans-serif;--b:'IBM Plex Sans Arabic',sans-serif;--m:'Space Grotesk',monospace;--e:cubic-bezier(.22,.9,.24,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font:400 15px/1.6 var(--b);color:var(--cream);background:var(--navy);min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--h);font-weight:700;line-height:1.25}
.mono{font-family:var(--m);direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* دخول */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 80% 0,#1b2f6b,transparent 60%),var(--navy)}
.login form{width:min(380px,100%);background:var(--n2);border:1px solid var(--line);border-radius:22px;padding:32px;display:grid;gap:14px;box-shadow:0 40px 80px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;font:800 24px var(--h)}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--or);display:grid;place-items:center}
.brand em{font-style:normal;color:var(--or)}

/* عناصر */
.in,select.in,textarea.in{width:100%;background:rgba(244,239,230,.05);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:.2s}
.in:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(255,106,19,.15)}
select.in option{color:#000}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;transition:.2s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:wait}
.or{background:var(--or);color:#fff}.or:hover{filter:brightness(1.1)}
.gr{background:var(--gr);color:#03200f}.rd{background:var(--red);color:#fff}
.gh{background:rgba(244,239,230,.05);border-color:var(--line)}.gh:hover{border-color:rgba(244,239,230,.3)}
.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.err{color:var(--red);font-size:13px;min-height:18px}

/* الهيكل */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 8px 18px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:500;cursor:pointer}
.side a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side a:hover{color:var(--cream);background:rgba(244,239,230,.04)}
.side a.on{color:#fff;background:rgba(255,106,19,.14);box-shadow:inset 3px 0 0 var(--or)}
.side .me{margin-top:auto;padding:12px;border-radius:14px;background:var(--n2);font-size:13px}
.side .me b{display:block;font-size:14px}
main{padding:26px 30px 90px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px}
.card{background:var(--n2);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--n2);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{display:block;font:700 26px var(--m);direction:ltr;text-align:right;margin-top:4px}
.kpi.o{background:linear-gradient(150deg,var(--or),#d94c00);border:0}.kpi.o span{color:#ffe2cf}
.kpi.g b{color:var(--gr)}.kpi.r b{color:var(--red)}.kpi.y b{color:var(--yl)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--n2)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:rgba(244,239,230,.03)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{color:#c7cee3;background:rgba(199,206,227,.1)}.s-picked{color:var(--bl);background:rgba(76,141,255,.12)}
.s-inbound{color:#a78bfa;background:rgba(167,139,250,.12)}.s-outbound{color:var(--or);background:rgba(255,106,19,.12)}
.s-delivered{color:var(--gr);background:rgba(25,195,125,.12)}.s-failed{color:var(--yl);background:rgba(245,181,46,.12)}
.s-returning,.s-returned{color:#f472b6;background:rgba(244,114,182,.12)}.s-cancelled{color:var(--red);background:rgba(255,75,75,.12)}
.muted{color:var(--muted)}.sm-t{font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* درج التفاصيل + مودال */
.ov{position:fixed;inset:0;background:rgba(3,8,22,.6);backdrop-filter:blur(4px);z-index:80;display:flex;justify-content:flex-start}
.drawer{width:min(520px,100%);height:100%;overflow:auto;background:var(--n2);border-inline-end:1px solid var(--line);padding:24px;animation:sl .35s var(--e)}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.modal{margin:auto;width:min(480px,calc(100% - 30px));background:var(--n2);border:1px solid var(--line);border-radius:20px;padding:24px;animation:sl .3s var(--e);max-height:90vh;overflow:auto}
.tl{display:grid;gap:0;margin-top:10px}
.tl div{position:relative;padding:0 26px 16px 0;border-right:2px solid var(--line);margin-right:7px}
.tl div::before{content:"";position:absolute;right:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--n3);border:2px solid var(--muted)}
.tl div:last-child{border-color:transparent}
.tl div.c::before{background:var(--or);border-color:var(--or)}
.tl b{display:block;font-size:14px}.tl span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)}

/* مسح */
.scan{font:700 22px var(--m);direction:ltr;text-align:center;letter-spacing:2px;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(244,239,230,.06);font:600 13px var(--m);direction:ltr}
.chip.ok{background:rgba(25,195,125,.15);color:var(--gr)}.chip.bad{background:rgba(255,75,75,.15);color:var(--red)}

/* مندوب */
.job{background:var(--n2);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.job .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.job .cod{font:700 22px var(--m);color:var(--or)}
.job .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* رسم */
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;align-items:stretch;position:relative}
.bars i{display:block;border-radius:4px 4px 0 0;min-height:2px}
.bars i.a{background:rgba(244,239,230,.2)}.bars i.b{background:var(--or)}
.bars span{font:500 10px var(--m);color:var(--muted);text-align:center;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;padding:12px 20px;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:600;box-shadow:0 20px 40px rgba(0,0,0,.4);animation:sl .3s var(--e)}
.toast.bad{background:var(--red);color:#fff}
.load{position:fixed;top:0;inset-inline:0;height:3px;z-index:99;background:linear-gradient(90deg,transparent,var(--or),transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.mnav{display:none}

/* طباعة البوليصة */
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-family:var(--b)}
  .lbl{width:100mm;min-height:140mm;border:2px solid #000;border-radius:4mm;padding:5mm;margin:0 auto 5mm;page-break-after:always;display:grid;gap:3mm}
  .lbl .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #000;padding-bottom:3mm}
  .lbl .hd b{font:800 22pt var(--h)}
  .lbl .big{font:800 15pt var(--h)}
  .lbl .cod{font:800 20pt var(--m);border:2px solid #000;border-radius:3mm;text-align:center;padding:2mm}
  .lbl svg{width:100%;height:22mm}
  .lbl small{font-size:9pt;color:#333}
}

@media(max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:18px 14px 90px}
  .cols2,.f3,.f2{grid-template-columns:1fr}.span2{grid-column:auto}
  .mnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:70;background:var(--ink);border-top:1px solid var(--line);overflow-x:auto;padding:6px}
  .mnav a{flex:1;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:11px;color:var(--muted)}
  .mnav a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mnav a.on{color:var(--or)}
  .job .acts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ======== تسجيل الدخول ======== -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <div class="brand"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-7 4 5 3-4 4 4"/></svg></i>وصّلي<em>.</em></div>
    <p class="muted" id="loginSub">سيستم الموظفين — سجّل دخولك</p>
    <label class="f">اسم المستخدم<input class="in" name="username" autocomplete="username" required></label>
    <label class="f">الباسورد<input class="in" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn or" type="submit">دخول</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- ======== السيستم ======== -->
<div class="app" id="appView" hidden>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="mnav" id="mnav" hidden></nav>
<div id="print"></div>

<script src="config.js"></script>
<script>
/* ============ الإعدادات ============ */
const API_URL = window.WASSALY_API || ""; // اللينك بيتحط في ملف config.js
const APP_MODE = "delivery"; // admin = الإدارة والمحاسبة ، delivery = صفحة المناديب

/* ============ أدوات ============ */
const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (Number(n) || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const dt = v => { if (!v) return "—"; const d = new Date(v); return isNaN(d) ? "—" : d.toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const today = () => new Date().toISOString().slice(0, 10);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

const ST = { new: "تم التسجيل", picked: "استلام من التاجر", inbound: "في المخزن", outbound: "خرجت للتوصيل", delivered: "تم التسليم",
  failed: "محاولة فاشلة", returning: "مرتجع في الطريق", returned: "تم الإرجاع", cancelled: "ملغية" };
const pill = s => `<span class="pill s-${esc(s)}">${esc(ST[s] || s)}</span>`;
const ROLE_NAME = { admin: "مدير", accountant: "محاسب", ops: "عمليات ومخزن", courier: "مندوب" };
const GOVS = ["القاهرة","الجيزة","الإسكندرية","القليوبية","الشرقية","الدقهلية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","مطروح","الوادي الجديد","شمال سيناء","جنوب سيناء"];
const FAIL_REASONS = ["العميل مبيردش", "العميل طلب تأجيل", "العنوان غلط", "العميل رفض الاستلام", "التليفون مقفول", "سبب تاني"];

const TKEY = "ws_token_" + APP_MODE;
let TOKEN = store.get(TKEY), ME = null, RATES = [], loading = 0;
function busy(on) { loading += on ? 1 : -1; let b = $("#ld"); if (loading > 0 && !b) document.body.insertAdjacentHTML("beforeend", '<div class="load" id="ld"></div>'); if (loading <= 0 && b) b.remove(); }
function toast(msg, bad) { $$(".toast").forEach(t => t.remove()); document.body.insertAdjacentHTML("beforeend", `<div class="toast ${bad ? "bad" : ""}">${esc(msg)}</div>`); setTimeout(() => $$(".toast").forEach(t => t.remove()), 3200); }

/* كاش سريع: بيعرض آخر بيانات محفوظة فورًا وبيحدّثها في الخلفية */
const READS = ["dashboard", "listShipments", "listMerchants", "listUsers", "accounting", "report", "myShipments", "rates"];
const LIVE_VIEWS = ["dash", "ships", "merchants", "acc", "reports", "courier", "settings"];
const mem = {}; let FRESH = false, CUR = null, CUR_ARGS = [];
const ck = (a, p) => "c_" + APP_MODE + "_" + (ME ? ME.id : "") + "_" + a + "_" + JSON.stringify(p);
function cget(k) { if (mem[k]) return mem[k]; try { const v = sessionStorage.getItem(k); return v ? (mem[k] = v) : null; } catch (e) { return null; } }
function cset(k, v) { mem[k] = v; try { sessionStorage.setItem(k, v); } catch (e) {} }
function cclear() { for (const k in mem) delete mem[k]; try { Object.keys(sessionStorage).filter(k => k.startsWith("c_")).forEach(k => sessionStorage.removeItem(k)); } catch (e) {} }
async function call(action, payload) {
  busy(true);
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token: TOKEN, ...payload }) });
    const j = await r.json();
    if (!j.ok) { if (/الجلسة|سجّل دخول/.test(j.error)) logout(true); throw new Error(j.error); }
    return j.data;
  } finally { busy(false); }
}
async function api(action, payload = {}) {
  if (!API_URL) throw new Error("لازم تحط لينك الـ API في ملف config.js الأول");
  if (!READS.includes(action)) { const d = await call(action, payload); if (!["login", "me", "getShipment"].includes(action)) cclear(); return d; }
  const k = ck(action, payload), hit = cget(k);
  if (hit && !FRESH) {
    const view = CUR;
    call(action, payload).then(d => { const s = JSON.stringify(d); if (s !== hit) { cset(k, s); if (view && view === CUR && !$("#ov") && LIVE_VIEWS.includes(view) && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) { FRESH = true; VIEWS[view](...CUR_ARGS).catch(() => {}).finally(() => FRESH = false); } } }).catch(() => {});
    return JSON.parse(hit);
  }
  const d = await call(action, payload); cset(k, JSON.stringify(d)); return d;
}
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); throw e; } }

/* ============ أيقونات ============ */
const I = {
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  wh: '<path d="M3 21V8l9-5 9 5v13M7 21v-7h10v7M7 17h10"/>',
  route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a4 4 0 000-8H8a4 4 0 010-8h8"/>',
  bike: '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2l3 7.5M5.5 17.5l4-7h6l3 7M9 6h3"/>',
  store: '<path d="M3 9l1.5-5h15L21 9M3 9h18v11H3zM3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0M9 20v-6h6v6"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 10v4M18 10v4"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  out: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const svg = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;

/* ============ الصفحات حسب الدور ============ */
const PAGES = [
  { id: "dash", t: "لوحة التحكم", i: "dash", r: ["admin", "accountant", "ops"] },
  { id: "ships", t: "الشحنات", i: "box", r: ["admin", "accountant", "ops"] },
  { id: "new", t: "شحنة جديدة", i: "plus", r: ["admin", "ops"] },
  { id: "wh", t: "المخزن (وارد وصادر)", i: "wh", r: ["admin", "ops"] },
  { id: "dispatch", t: "توزيع على المناديب", i: "route", r: ["admin", "ops"] },
  { id: "courier", t: "شحناتي (دليفري)", i: "bike", r: ["admin", "courier"] },

function shell() {
  if (!myPages().length) {
    showLogin(); TOKEN = null; store.set(TKEY, null); store.set(MEKEY, null);
    $("#loginErr").innerHTML = APP_MODE === "admin" ? 'الحساب ده حساب مندوب — ادخل من <a href="delivery.html" style="color:var(--or)">صفحة الدليفري</a>' : 'الحساب ده مش حساب مندوب — ادخل من <a href="admin.html" style="color:var(--or)">صفحة الإدارة</a>';
    return;
  }
  $("#loginView").hidden = true; $("#appView").hidden = false; $("#mnav").hidden = false;
  const links = myPages().map(p => `<a data-p="${p.id}">${svg(p.i)}<span>${p.t}</span></a>`).join("");

    <div class="me"><b>${esc(ME.name)}</b><span class="muted">${ROLE_NAME[ME.role]}</span><br><a style="padding:8px 0 0;display:inline-flex" id="logoutBtn">${svg("out")} خروج</a></div>`;
  $("#mnav").hidden = myPages().length < 2;
  $("#mnav").innerHTML = myPages().map(p => `<a data-p="${p.id}">${svg(p.i)}<span>${p.t.split(" ")[0]}</span></a>`).join("");
  $$("[data-p]").forEach(a => a.onclick = () => go(a.dataset.p));
  $("#logoutBtn").onclick = () => logout();
  const h = location.hash.slice(1);
  go(myPages().some(p => p.id === h) ? h : myPages()[0].id);
}
function go(id) {
  if (!myPages().some(p => p.id === id)) id = myPages()[0].id;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  $$("[data-p]").forEach(a => a.classList.toggle("on", a.dataset.p === id));
  $("#main").innerHTML = '<div class="empty">جاري التحميل…</div>';
  CUR = id; CUR_ARGS = [];

  scrollTo(0, 0);
}
function logout(silent) { if (!silent) call("logout", {}).catch(() => {}); TOKEN = null; store.set(TKEY, null); store.set(MEKEY, null); cclear(); ME = null; showLogin(); }

  $$("[data-u]").forEach(b => b.onclick = () => userForm(users[b.dataset.u]));
  $("#sr").onclick = async () => {
    const rs = GOVS.map(g => ({ governorate: g, fee: $(`[data-g="${g}"][data-k=fee]`).value, days: $(`[data-g="${g}"][data-k=days]`).value }));
    await run(() => api("saveRates", { rates: rs }), "اتحفظت الأسعار");
  };
};

/* ============ طباعة البوليصة ============ */
function printLabels(list) {
  $("#print").innerHTML = list.map((s, i) => `<div class="lbl">
    <div class="hd"><b>وصّلي.</b><span>${new Date(s.created || Date.now()).toLocaleDateString("ar-EG")}</span></div>
    <svg id="bc${i}"></svg>
    <div><small>المستلم</small><div class="big">${esc(s.receiverName)}</div><div style="font-family:var(--m);direction:ltr;text-align:right">${esc(s.receiverPhone)}</div></div>
    <div><small>العنوان</small><div class="big">${esc(s.governorate)} - ${esc(s.city)}</div><div>${esc(s.address)}</div></div>
    <div style="display:flex;justify-content:space-between;gap:3mm"><div><small>التاجر</small><div>${esc(s.merchantName || "—")}</div></div><div><small>القطع</small><div>${esc(s.pieces)}</div></div><div><small>المحتوى</small><div>${esc(s.content || "—")}</div></div></div>
    <div><small>المطلوب تحصيله</small><div class="cod">${money(s.cod)} ج.م</div></div>
    ${s.notes ? `<div><small>ملاحظات</small><div>${esc(s.notes)}</div></div>` : ""}
    <small>تتبّع شحنتك بالكود: ${esc(s.code)}</small>
  </div>`).join("");
  list.forEach((s, i) => { try { JsBarcode("#bc" + i, s.code, { format: "CODE128", displayValue: true, fontSize: 16, height: 60, margin: 0 }); } catch (e) { $("#bc" + i).outerHTML = `<div style="font:700 20pt var(--m);text-align:center">${esc(s.code)}</div>`; } });
  setTimeout(() => window.print(), 300);
}

/* ============ تشغيل ============ */
$("#loginSub").textContent = APP_MODE === "delivery" ? "صفحة المناديب — سجّل دخولك" : "الإدارة والمحاسبة — سجّل دخولك";
document.title = APP_MODE === "delivery" ? "وصّلي | الدليفري" : "وصّلي | الإدارة والمحاسبة";
const MEKEY = "ws_me_" + APP_MODE;
function boot2(user) { ME = user; RATES = user.rates || []; store.set(MEKEY, JSON.stringify(user)); shell(); }
(async () => {
  if (!TOKEN) return showLogin();
  let cached = null; try { cached = JSON.parse(store.get(MEKEY) || "null"); } catch (e) {}
  if (cached) { ME = cached; RATES = cached.rates || []; shell(); }
  try { const u = await call("me", {}); if (!cached) boot2(u); else { store.set(MEKEY, JSON.stringify(u)); RATES = u.rates || RATES; } }
  catch (e) { if (!TOKEN) return; if (!cached) showLogin(); }
})();
</script>
